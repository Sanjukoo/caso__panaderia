<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panadería artesanal Triga</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <script src="script.js" defer></script>
</head>

<body class="bg-light">

  <main class="container py-4">

    <h1>Panadería artesanal Triga</h1>

    <form id="pedido" class="card p-3">

      <div class="mb-3">
        <label for="cliente" class="form-label">Nombre</label>
        <input
          id="cliente"
          name="cliente"
          class="form-control"
          minlength="3"
          maxlength="60"
          required>
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          class="form-control"
          required>
      </div>

      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha de entrega</label>
        <input
          id="fecha"
          name="fecha"
          type="date"
          class="form-control"
          min="2026-09-29"
          required>
      </div>

      <fieldset class="mb-3">
        <legend class="fs-5">Productos</legend>

        <div class="mb-2">
          <label>Pan de masa madre - S/ 18</label>
          <input
            id="pan"
            name="pan"
            type="number"
            class="form-control"
            min="0"
            max="10"
            value="0">
        </div>

        <div class="mb-2">
          <label>Caja de alfajores - S/ 24</label>
          <input
            id="alfajores"
            name="alfajores"
            type="number"
            class="form-control"
            min="0"
            max="10"
            value="0">
        </div>

        <div class="mb-2">
          <label>Torta pequeña - S/ 45</label>
          <input
            id="torta"
            name="torta"
            type="number"
            class="form-control"
            min="0"
            max="10"
            value="0">
        </div>
      </fieldset>

      <fieldset class="mb-3">
        <legend class="fs-5">Modalidad</legend>

        <input
          id="recojo"
          name="modalidad"
          type="radio"
          value="recojo"
          checked>

        <label for="recojo">Retiro gratuito</label>

        <br>

        <input
          id="reparto"
          name="modalidad"
          type="radio"
          value="reparto">

        <label for="reparto">Reparto: S/ 8.00</label>
      </fieldset>

      <button class="btn btn-primary" type="submit">
        Calcular
      </button>

      <button class="btn btn-secondary mt-2" type="reset">
        Limpiar
      </button>

    </form>

    <p id="mensaje" role="status" class="mt-3"></p>

    <pre id="resultado" class="mt-3 text-wrap"></pre>

  </main>

</body>
</html>
